<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" fill="none" role="img" aria-label="SolMais">
  <defs>
    <linearGradient id="sunGrad" x1="20" y1="20" x2="80" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset=".5" stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="sunCore" cx="50" cy="50" r="30" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFBEB"/>
      <stop offset=".6" stop-color="#FCD34D"/>
      <stop offset="1" stop-color="#F59E0B"/>
    </radialGradient>
    <linearGradient id="panelGrad" x1="30" y1="60" x2="80" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0EA5E9"/>
      <stop offset=".5" stop-color="#2563EB"/>
      <stop offset="1" stop-color="#1E40AF"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="45" y1="75" x2="85" y2="55" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4ADE80"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="textSol" x1="95" y1="40" x2="150" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FDE047"/>
      <stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="textMais" x1="160" y1="40" x2="285" y2="40" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset=".5" stop-color="#0EA5E9"/>
      <stop offset="1" stop-color="#6366F1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Sun rays -->
  <g transform="translate(50,50)" opacity=".9">
    <g stroke="url(#sunGrad)" stroke-width="3" stroke-linecap="round">
      <line x1="0" y1="-40" x2="0" y2="-30"/>
      <line x1="28" y1="-28" x2="21" y2="-21"/>
      <line x1="40" y1="0" x2="30" y2="0"/>
      <line x1="28" y1="28" x2="21" y2="21"/>
      <line x1="0" y1="40" x2="0" y2="30"/>
      <line x1="-28" y1="28" x2="-21" y2="21"/>
      <line x1="-40" y1="0" x2="-30" y2="0"/>
      <line x1="-28" y1="-28" x2="-21" y2="-21"/>
    </g>
  </g>

  <!-- Sun core -->
  <circle cx="50" cy="50" r="22" fill="url(#sunCore)" filter="url(#glow)"/>

  <!-- Solar panel -->
  <path d="M30 58 L72 42 L84 70 L42 86 Z" fill="url(#panelGrad)" stroke="#60A5FA" stroke-width="1" opacity=".95"/>
  <path d="M40 55 L75 43 M44 63 L79 51 M48 71 L83 59" stroke="#93C5FD" stroke-width=".5" opacity=".7"/>
  <path d="M58 49 L56 79 M67 46 L65 76" stroke="#93C5FD" stroke-width=".5" opacity=".7"/>

  <!-- Leaf -->
  <path d="M40 82 C40 70 58 64 72 58 C78 66 74 80 62 86 C54 89 44 88 40 82 Z" fill="url(#leafGrad)" opacity=".95"/>
  <path d="M44 80 C52 74 60 70 70 62" stroke="#15803D" stroke-width="1" fill="none" opacity=".4"/>

  <!-- Text -->
  <g filter="url(#glow)" font-family="Inter, Arial, sans-serif" font-weight="800" letter-spacing="-1.2">
    <text x="95" y="62" font-size="38" fill="url(#textSol)">Sol</text>
    <text x="156" y="62" font-size="38" fill="url(#textMais)">Mais</text>
  </g>

  <!-- Tagline -->
  <text x="97" y="78" font-family="Inter, Arial, sans-serif" font-size="7.5" font-weight="600" fill="#94A3B8" letter-spacing="1.5">ENERGIA SOLAR INTELIGENTE</text>
</svg>